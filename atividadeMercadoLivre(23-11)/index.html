
<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mercado Livre</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    </head>
    <body>
        <nav class="navOne">
            <img id="logo" src="img/logo.webp" alt="Logo do Mercado Livre">
            <form class="pesquisa" action="#" method="get">
                <input type="search" name="q" placeholder="Buscar produtos, marcas e muito mais..." aria-label="Buscar produtos">
                <button type="submit" aria-label="Pesquisar">
                    <img src="img/search.png" alt="">
                </button>
            </form>
            <img id="teste" src="img/teste.webp" alt="">
            <br>
        </nav>
        <nav class="navTwo">
            <div>
                <img src="img/point.png" alt="">
                <p><span>Enviar para</span><br>Natal 40028922</p>
            </div>
            <div class="categorias">
                <p>Categorias</p>
                <p>Ofertas</p>
                <p>Cupons</p>
                <p>Supermercado</p>
                <p>Moda</p>
                <p>Mercado Play</p>
                <p>Vender</p>
                <p>Contato</p>
            </div>
            <div class="login">
                <p>Crie a sua conta</p>
                <p>Entre</p>
                <p>Compras</p>
                <img src="img/trolley.png" alt="">
            </div>
        </nav>
        <div id="carouselExampleIndicators" class="carousel slide">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="4" aria-label="Slide 5"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="5" aria-label="Slide 6"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="6" aria-label="Slide 7"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="img/img1.webp" class="d-block w-100" alt="Banner 1">
                </div>
                <div class="carousel-item">
                    <img src="img/img2.webp" class="d-block w-100" alt="Banner 2">
                </div>
                <div class="carousel-item">
                    <img src="img/img3.webp" class="d-block w-100" alt="Banner 3">
                </div>
                <div class="carousel-item">
                    <img src="img/img4.webp" class="d-block w-100" alt="Banner 4">
                </div>
                <div class="carousel-item">
                    <img src="img/img5.webp" class="d-block w-100" alt="Banner 5">
                </div>
                <div class="carousel-item">
                    <img src="img/img6.webp" class="d-block w-100" alt="Banner 6">
                </div>
                <div class="carousel-item">
                    <img src="img/img7.webp" class="d-block w-100" alt="Banner 7">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
    </body>
</html>
