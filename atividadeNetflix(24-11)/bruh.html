<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruh</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            gap: 40px;
        }

        h1 {
            font-size: 3rem;
        }

        img {
            border-radius: 50%;
            width: 300px;
            height: auto;
            box-shadow: 0 0 20px 5px rgba(63, 63, 63, 0.5);
        }

        button {
            width: 30%;
            padding: 10px;
            font-size: 1.4rem;
            border-radius: 50px;
            background-color: aqua;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px 5px rgba(63, 63, 63, 0.5);
        }
    </style>
</head>
<body>
    <h1>Bem-vindo!</h1>
    <img src="img/bruh.jpeg" alt="">
    <button onclick="window.location.href='index.html'">Voltar</button>
</body>
</html>
