<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Netflix</title>
  </head>
  <body>
    <header>
      <img src="img/logo.png" alt="Logo da Netflix" />
    </header>
    <main>
      <h2>Quem está assistindo?</h2>
      <div class="users">
        <div class="card">
          <img src="img/user1.jpg" alt="" />
          <p>João</p>
        </div>
        <div class="card">
          <img src="img/user2.jpg" alt="" />
          <p>Maria</p>
        </div>
        <div class="card">
          <img src="img/user3.jpg" alt="" />
          <p>José</p>
        </div>
        <div class="card">
          <div class="newUser">
            <img src="img/add.png" alt="" />
          </div>
          <p>Adicionar perfil</p>
        </div>
      </div>
      <button>
        <img src="img/pencil.png" alt="" />
        <p>Gerenciar perfis</p>
      </button>
    </main>
  </body>
</html>
